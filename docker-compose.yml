services:

  postgres:
    image: postgres:16
    container_name: research-system-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: research_system

    ports:
      - "5432:5432"

    volumes:
      - research_postgres_data:/var/lib/postgresql/data


  research-app:
    build: .
    container_name: research-system-app
    depends_on:
      - postgres

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/research_system

    env_file:
      - .env

    stdin_open: true
    tty: true


volumes:
  research_postgres_data: